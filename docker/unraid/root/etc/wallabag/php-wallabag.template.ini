memory_limit = ${PHP_MEMORY_LIMIT:-128M}

; Keep deprecation noise out of the FastCGI/nginx error log in production.
; Several third-party bundles still trip PHP 8.4's implicit-nullable deprecation;
; nginx logs anything on FastCGI stderr at [error] level, so silence them here.
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
